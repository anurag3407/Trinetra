# Upstream Next.js Standalone Container
upstream trinetra_upstream {
    server 127.0.0.1:3010;
    keepalive 32;
}

# WebSocket upgrade mapping
map $http_upgrade $trinetra_connection_upgrade {
    default upgrade;
    '' close;
}

# Port 80: ACME Challenge + Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name trinetra.sayalabs.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: Production HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trinetra.sayalabs.in;

    ssl_certificate /etc/letsencrypt/live/trinetra.sayalabs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trinetra.sayalabs.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    # Static Assets Caching
    location /_next/static/ {
        proxy_pass http://trinetra_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files
    location /favicon.ico {
        proxy_pass http://trinetra_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Reverse Proxy to Trinetra App
    location / {
        proxy_pass http://trinetra_upstream;
        proxy_http_version 1.1;

        # Disable buffering for real-time SSE / Copilot streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $trinetra_connection_upgrade;
    }
}
